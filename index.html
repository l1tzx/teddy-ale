<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💛 Para Albita</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- PARTICLES -->

<div id="particles"></div>

<!-- MUSIC -->

<button id="musicBtn">

🎵 Nuestra Canción

</button>

<audio id="music">

<source src="Dos Soledades.mp4" type="video/mp4">

</audio>

<!-- LANDING -->

<section id="landing">

<div class="landingCard">

<h1>

💛 Para ti, chiquita Albita

</h1>

<p>

Una pequeña historia hecha especialmente para ti.

</p>

<button id="openBook">

📖 Abrir Libro

</button>

</div>

</section>

<!-- BOOK AREA -->

<section id="bookSection" class="hidden">

<div id="bookContainer">

<div id="leftPage">

<div id="pageContent">

<h2>Bienvenida 💛</h2>

<p>

Presiona la flecha para comenzar.

</p>

</div>

</div>

<div id="rightPage">

<img id="pageImage" src="alba2.jpg">

</div>

</div>

<!-- NAVIGATION -->

<div id="navigation">

<button id="prevBtn">

⬅️

</button>

<span id="pageNumber">

Página 1 / 10

</span>

<button id="nextBtn">

➡️

</button>

</div>

</section>

<!-- SECRET CAT -->

<div id="secretCat">

🐱

</div>

<!-- MESSAGE POPUP -->

<div id="popup">

</div>

<script src="script.js"></script>

</body>
</html>
